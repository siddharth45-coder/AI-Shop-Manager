<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI Shop Manager</title>

<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

    <nav class="navbar">
    <h1>🤖 AI Shop Manager</h1>
    <p>Smart Shop Management & Decision Support System</p>
</nav>

<main class="container">

    <h2>Shop Dashboard</h2>

    <section class="cards">

        <div class="card">
            <h3>Total Products</h3>
            <p id="total-products">0</p>
        </div>

        <div class="card">
            <h3>Today's Sales</h3>
            <p id="today-sales">₹0</p>
        </div>

        <div class="card">
            <h3>Low Stock</h3>
            <p id="low-stock">0</p>
        </div>

    </section>

    <section class="products-section">

        <h2>Products</h2>

        <table>
            <thead>
                <tr>
                    <th>Product Name</th>
                    <th>Price</th>
                    <th>Stock</th>
                    <th>Status</th>
                </tr>
            </thead>

            <tbody id="product-table">
            </tbody>

        </table>

    </section>

</main>

<script src="{{ url_for('static', filename='js/script.js') }}"></script>

</body>
</html>
